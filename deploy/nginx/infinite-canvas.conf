# 无限画布自定义域名反向代理示例。
#
# 使用前替换三处：
#   1. canvas.example.com  → 你的域名
#   2. /etc/nginx/ssl/...  → 你的证书路径（Cloudflare 源站证书或 Let's Encrypt）
#   3. 127.0.0.1:3010      → 容器映射到宿主机的端口
#
# 放置到 /etc/nginx/sites-enabled/ 或 /etc/nginx/conf.d/ 后执行：nginx -t && systemctl reload nginx
# 完整步骤见 docs/content/docs/overview/custom-domain.mdx

server {
    listen 443 ssl;
    server_name canvas.example.com;

    ssl_certificate     /etc/nginx/ssl/canvas.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/canvas.example.com.key;

    # 方式一：反向代理容器。容器内置单页应用回退，这里不需要额外的 try_files。
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 方式二：直接托管构建产物时，改用下面这段替换上面的 location /。
    # 单页应用必须回退到 index.html，否则直接访问 /canvas/<id> 或刷新页面会 404。
    # root /opt/infinite-canvas;
    # index index.html;
    # location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name canvas.example.com;
    return 301 https://$host$request_uri;
}
